
name: home-server-minecraft

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  minecraft:
    image: itzg/minecraft-server@sha256:9d2707c109da523f5f71c2ad7e38e4fdf7e500f8301ea45bc22708036cf593bb
    logging: *default-logging
    container_name: minecraft
    networks:
      - minecraft-net
    environment:
      EULA: "TRUE"
      TYPE: ${MC_TYPE}
      VERSION: ${MC_VERSION}
      MEMORY: ${MC_MEMORY}
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/2.11.2/builds/1230/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/2.2.5/builds/140/downloads/spigot
      ONLINE_MODE: "TRUE"
      TZ: ${TZ}
    volumes:
      - ${APPDATA}/minecraft:/data
    ports:
      - "25565:25565"
      - "19132:19132/udp"
    stdin_open: true
    tty: true
    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 4G

networks:
  minecraft-net:
    name: minecraft-net