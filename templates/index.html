<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>home.{{DOMAIN_NAME}}</title>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    /* Your existing CSS – unchanged, put it here */
    :root {
      --bg: #0d1117;
      --panel: #131a24;
      --panel-hover: #182231;
      --line: #232d3b;
      --text: #d3dae3;
      --dim: #6b7889;
      --accent: #5fd0a8;
      --accent-dim: rgba(95, 208, 168, 0.12);
    }

    [x-cloak] {
      display: none !important;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "SF Mono", "JetBrains Mono", "Consolas", monospace;
      min-height: 100vh;
      padding: 56px 24px 80px;
    }

    header {
      max-width: 760px;
      margin: 0 auto 36px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .prompt {
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 0.08em;
      display: inline-block;
    }

    .prompt a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px dashed var(--accent-dim);
    }

    .prompt a:hover {
      border-bottom-style: solid;
      color: #7ae0b8;
    }

    h1 {
      font-size: 30px;
      font-weight: 600;
      margin-top: 8px;
      letter-spacing: -0.02em;
    }

    .sub {
      color: var(--dim);
      font-size: 12px;
      margin-top: 7px;
    }

    .server-info {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 17px;
      color: var(--dim);
      font-size: 11px;
    }

    .status {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .server-ip {
      color: var(--text);
      background: #0a0f16;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 4px 8px;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .service {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 72px;
      padding: 15px 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--text);
      transition: background 0.12s ease, border-color 0.12s ease, transform 0.12s ease;
    }

    .service:hover {
      background: var(--panel-hover);
      border-color: #304052;
      transform: translateY(-1px);
    }

    .service:hover .name {
      color: var(--accent);
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-dim);
      flex-shrink: 0;
      margin-left: 3px;
    }

    .dot-off {
      background: var(--dim);
      box-shadow: 0 0 0 4px rgba(107, 120, 137, 0.12);
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .name {
      font-size: 14px;
      font-weight: 600;
      transition: color 0.12s ease;
    }

    .desc {
      color: var(--dim);
      font-size: 11px;
      margin-top: 4px;
    }

    .note {
      color: var(--dim);
      font-size: 11px;
      margin-top: 3px;
    }

    .addresses {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .domain {
      color: var(--dim);
      font-size: 11px;
      text-decoration: none;
    }

    .domain:hover {
      color: var(--accent);
    }

    .ip-link {
      display: inline-flex;
      align-items: center;
      color: #8c98a8;
      background: #0a0f16;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 10px;
      text-decoration: none;
      transition: color 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }

    .ip-link:hover {
      color: var(--accent);
      border-color: #3b5a50;
      background: #0d1716;
    }

    .ip-label {
      color: #4f5b6b;
      margin-right: 5px;
    }

    .files-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 7px;
      overflow: hidden;
    }

    .files-header {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 72px;
      padding: 15px 16px;
    }

    .files-instructions {
      border-top: 1px solid var(--line);
      padding: 16px 20px 18px 44px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .platform {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 11px;
    }

    .platform-label {
      color: var(--accent);
      font-weight: 600;
      width: 84px;
      flex-shrink: 0;
    }

    .platform code {
      background: #0a0f16;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 5px 8px;
      color: var(--text);
      font-size: 10px;
    }

    .platform .hint {
      color: var(--dim);
    }

    .notify-empty {
      color: var(--dim);
      font-size: 11px;
    }

    .send-form {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 4px;
      flex: 1;
    }

    .send-form input {
      flex: 1;
      background: #0a0f16;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 6px 10px;
      color: var(--text);
      font-size: 11px;
      font-family: inherit;
      outline: none;
    }

    .send-form input:focus {
      border-color: var(--accent);
    }

    .send-form button {
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 4px;
      padding: 6px 14px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.12s ease;
    }

    .send-form button:hover {
      background: rgba(95, 208, 168, 0.2);
    }

    .send-form button:active {
      transform: scale(0.96);
    }

    footer {
      max-width: 760px;
      margin: 30px auto 0;
      color: var(--dim);
      font-size: 10px;
      opacity: 0.8;
    }

    @media (max-width: 650px) {
      body {
        padding: 36px 16px 60px;
      }

      .addresses {
        flex-direction: column;
        align-items: flex-end;
      }

      .domain {
        display: none;
      }

      .files-instructions {
        padding-left: 20px;
      }

      .platform-label {
        width: 70px;
      }
    }

    @media (max-width: 480px) {
      .service {
        gap: 12px;
      }

      .addresses {
        display: none;
      }

      .desc,
      .note {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .send-form {
        flex-wrap: wrap;
      }

      .send-form input {
        min-width: 120px;
      }
    }
  </style>
</head>

<body>

  <div x-data="{
    serverIp: '{{SERVER_IP}}',
    useIp: false,
    ntfyTopic: '{{NTFY_TOPIC}}',
    ntfyConnected: false,
    notifications: [],
    newMessage: '',
    services: [],
    loading: true,

    getNtfyBaseUrl() {
      return this.useIp ? 'http://' + this.serverIp + ':8084' : 'https://ntfy.{{DOMAIN_NAME}}';
    },
    getNtfySseUrl() { return this.getNtfyBaseUrl() + '/' + this.ntfyTopic + '/sse'; },
    getNtfyJsonUrl(limit = 10) { return this.getNtfyBaseUrl() + '/' + this.ntfyTopic + '/json?limit=' + limit + '&poll=1'; },
    getNtfyPublishUrl() { return this.getNtfyBaseUrl() + '/' + this.ntfyTopic; },

    getToggleUrl() {
      return this.useIp ? 'https://home.{{DOMAIN_NAME}}' : 'http://' + this.serverIp + ':{{HOMEPAGE_PORT}}';
    },
    getToggleLabel() { return this.useIp ? 'Switch to domain' : 'Switch to IP'; },

    getProtocol(service) { return service.useHttps ? 'https://' : 'http://'; },
    domainUrl(service) { return this.getProtocol(service) + service.domain + (service.path || ''); },
    ipUrl(service) { return 'http://' + service.ip + ':' + service.port + (service.path || ''); },
    getServiceUrl(service) { return this.useIp ? this.ipUrl(service) : this.domainUrl(service); },

    // Click handler to force navigation
    navigate(service) {
      const url = this.getServiceUrl(service);
      window.location.href = url;
    },
    navigateDomain(service) {
      window.location.href = this.domainUrl(service);
    },
    navigateIp(service) {
      window.location.href = this.ipUrl(service);
    },

    async fetchLatestMessages(retry = 1) {
      try {
        const url = this.getNtfyJsonUrl(10);
        const resp = await fetch(url);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const text = await resp.text();
        let msgs;
        try { msgs = JSON.parse(text); if (!Array.isArray(msgs)) throw new Error(); }
        catch { msgs = text.split('\n').filter(l => l.trim()).map(l => JSON.parse(l)); }
        this.notifications = msgs.map(m => ({
          id: m.id,
          title: m.title || '',
          message: m.message || '',
          time: new Date(m.time * 1000).toLocaleTimeString()
        }));
      } catch (err) {
        console.warn('Fetch failed:', err);
        if (retry > 0) setTimeout(() => this.fetchLatestMessages(0), 500);
        else this.notifications = [];
      }
    },

    async sendMessage() {
      if (!this.newMessage.trim()) return;
      try {
        const resp = await fetch(this.getNtfyPublishUrl(), { method: 'POST', body: this.newMessage });
        if (!resp.ok) throw new Error('Send failed');
        this.newMessage = '';
      } catch (err) { alert('Failed to send notification: ' + err.message); }
    },

    initNtfy() {
      try {
        const es = new EventSource(this.getNtfySseUrl());
        es.onopen = () => { this.ntfyConnected = true; };
        es.onerror = () => { this.ntfyConnected = false; };
        es.onmessage = (e) => {
          let data;
          try { data = JSON.parse(e.data); } catch { return; }
          if (data.event !== 'message') return;
          this.notifications.unshift({
            id: data.id,
            title: data.title || '',
            message: data.message || '',
            time: new Date(data.time * 1000).toLocaleTimeString()
          });
          if (this.notifications.length > 10) this.notifications.pop();
        };
      } catch (err) {
        this.ntfyConnected = false;
        console.warn('SSE init failed:', err);
      }
    },

    loadServices() {
      fetch('/services.json?t=' + Date.now())
        .then(res => res.json())
        .then(data => {
          this.services = data;
          this.loading = false;
          console.log('Services loaded:', data);
        })
        .catch(err => {
          console.warn('Failed to load services:', err);
          this.loading = false;
          this.services = [];
        });
    }
  }" x-init="
    useIp = /^\d+\.\d+\.\d+\.\d+$/.test(window.location.hostname);
    loadServices();
    initNtfy();
    setTimeout(() => fetchLatestMessages(), 150);
  ">

    <header>
      <div class="prompt">
        <a :href="getToggleUrl()" :title="getToggleLabel()">~/home.{{DOMAIN_NAME}}$</a>
      </div>
      <h1>Services</h1>
      <div class="sub">Everything running on this network, one tap away.</div>
      <div class="server-info">
        <span class="status"></span>
        <span>server</span>
        <span class="server-ip" x-text="serverIp"></span>
      </div>
    </header>

    <main>
      <!-- Notifications -->
      <div class="files-card">
        <div class="files-header">
          <span class="dot" :class="{ 'dot-off': !ntfyConnected }"></span>
          <span class="info">
            <div class="name">Notifications</div>
            <div class="desc" x-text="ntfyConnected ? 'Listening on ' + ntfyTopic : 'Connecting to ntfy…'"></div>
          </span>
          <span class="addresses">
            <a class="domain" href="https://ntfy.{{DOMAIN_NAME}}">ntfy.{{DOMAIN_NAME}}</a>
          </span>
        </div>
        <div class="files-instructions">
          <div class="platform">
            <span class="platform-label">Send</span>
            <span class="send-form">
              <input type="text" x-model="newMessage" placeholder="Write a notification…" @keyup.enter="sendMessage()">
              <button @click="sendMessage()">Send</button>
            </span>
          </div>
          <template x-if="notifications.length">
            <template x-for="n in notifications" :key="n.id">
              <div class="platform">
                <span class="platform-label" x-text="n.time"></span>
                <span class="hint" x-text="n.title ? (n.title + ' — ' + n.message) : n.message"></span>
              </div>
            </template>
          </template>
          <template x-if="!notifications.length">
            <div class="platform"><span class="notify-empty">No notifications yet.</span></div>
          </template>
        </div>
      </div>

      <!-- Services -->
      <template x-if="loading">
        <div class="service" style="justify-content:center; color:var(--dim);">Loading services…</div>
      </template>
      <template x-if="!loading && services.length === 0">
        <div class="service" style="justify-content:center; color:var(--dim);">No services found.</div>
      </template>
      <template x-for="service in services" :key="service.name">
        <div class="service">
          <span class="dot"></span>
          <!-- Info link with click override -->
          <a class="info" :href="getServiceUrl(service)" @click.prevent="navigate(service)"
            style="text-decoration:none;color:inherit;cursor:pointer;">
            <div class="name" x-text="service.name"></div>
            <div class="desc" x-text="service.description"></div>
            <template x-if="service.note">
              <div class="note" x-text="service.note"></div>
            </template>
          </a>
          <span class="addresses">
            <!-- Domain link with click override -->
            <a class="domain" :href="domainUrl(service)" @click.prevent="navigateDomain(service)"
              x-text="service.domain"></a>
            <!-- IP link with click override -->
            <a class="ip-link" :href="ipUrl(service)" @click.prevent="navigateIp(service)">
              <span class="ip-label">IP</span>
              <span x-text="service.ip + ':' + service.port"></span>
            </a>
          </span>
        </div>
      </template>

      <!-- Minecraft & Files (unchanged) -->
      <!-- ... (keep your static sections) ... -->
    </main>
    <footer>Home server · served from this machine</footer>
  </div>

</body>

</html>
