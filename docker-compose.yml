# ---------------------------------------------------------------------------
# HOME SERVER STACK
# Services: Homepage (static dashboard of links), Traefik (reverse proxy with
#           automatic HTTPS via Cloudflare DNS-01), Portainer (docker mgmt UI),
#           Pi-hole (DNS + ad-block), Plex, qBittorrent, Stirling PDF (PDF toolkit),
#           Calibre-Web (ebook library/reader), ntfy (push notifications),
#           Samba (network file browsing)
#           Sonarr / Radarr / Prowlarr are included but commented out below -
#           uncomment them later if you want automated TV/movie fetching.
#
# IMAGE PINNING:
#   All currently-running images are pinned to their exact image digest.
#   This prevents `latest` from silently changing what gets deployed.
#
#   To intentionally update an image:
#       docker compose pull
#       docker compose up -d
#
#   Then inspect the new digest and update this file deliberately.
#
# BEFORE YOU START:
#   1. Create the folder structure on your host, e.g.:
#        /srv/appdata/{traefik,portainer,pihole,plex,qbittorrent,stirlingpdf,calibreweb,ntfy}
#        /srv/media/{movies,tv,downloads,books}
#   2. Keep index.html in the SAME folder as this docker-compose.yml
#      (the homepage service mounts it directly from there - no copying needed).
#   3. Local DNS records for Pi-hole (home.${DOMAIN_NAME}, plex.${DOMAIN_NAME}, etc.) are set
#      via the FTLCONF_dns_hosts environment variable below, using SERVER_IP
#      from .env - no separate file needed (Pi-hole v6 no longer reads
#      custom.list).
#   4. Edit the .env file with your paths, timezone, passwords, and:
#        ACME_EMAIL=your-email@example.com
#        CF_DNS_API_TOKEN=your_token
#        KUMA_USERNAME=admin
#        KUMA_PASSWORD=your-strong-password
#        NTFY_UPTIME_KUMA_TOPIC=your-long-unguessable-topic-name
#   5. Run: docker compose up -d
#   6. Traefik will automatically obtain Let's Encrypt certificates via DNS-01
#      for all configured subdomains. All services are reachable at:
#      https://<subdomain>.${DOMAIN_NAME}
#   7. The Traefik dashboard is available at https://traefik.${DOMAIN_NAME}
#      (basic auth is commented out below - uncomment to enable).
#   8. In Pi-hole, set your router's DNS (or each device's DNS) to the
#      server's IP so *.${DOMAIN_NAME} resolves for every device on the network.
#   9. AutoKuma automatically creates Uptime Kuma monitors from Docker labels.
#      It reads the kuma.* labels defined on each container. No manual setup
#      in the Uptime Kuma UI is needed.
#  10. Push notifications: the `uptime-kuma` service below declares a single
#      AutoKuma-managed "ntfy" notification provider (see NOTE on that service
#      for how it's wired). Every other service's monitor labels reference it
#      via `notification_name_list=["ntfy-uptime"]` so a down/up event on any
#      of them pushes a notification to your phone via ntfy. This uses
#      AutoKuma's `notification` label type, which its own docs mark as
#      experimental - if it doesn't behave as expected on your AutoKuma
#      version, create the same notification manually once in the Uptime Kuma
#      UI (Settings -> Notifications) instead; it only needs to exist once.
# ---------------------------------------------------------------------------

name: home-server

services:

  # ---------------- Home dashboard (static landing page linking to all services) ----------------
  homepage:
    image: nginx:alpine@sha256:db35bfc6b2951e7f8a72db5db120288c127ffaeeb4a6d4b95a26fead017d5913
    container_name: homepage
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./services.json:/usr/share/nginx/html/services.json:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.homepage.rule=Host(`home.${DOMAIN_NAME}`)
      - traefik.http.routers.homepage.entrypoints=websecure
      - traefik.http.routers.homepage.tls.certresolver=cloudflare
      - traefik.http.services.homepage.loadbalancer.server.port=80
      # AutoKuma monitor
      - kuma.homepage.http.name=Homepage
      - kuma.homepage.http.url=https://home.${DOMAIN_NAME}
      - kuma.homepage.http.notification_name_list=["ntfy-uptime"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

  # ---------------- Traefik reverse proxy (handles all HTTPS) ----------------
  traefik:
    image: traefik@sha256:ef751c695afd26e2be41009047f651153dc1e61ace03e6d13f299d8c4be842b8
    container_name: traefik
    command:
      - --log.level=INFO
      - --api.insecure=false
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # File provider: used only for services Traefik can't discover via Docker
      # labels, e.g. Plex, which runs with network_mode: host and therefore has
      # no reachable Docker-network IP for label-based discovery to use.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.cloudflare.acme.dnschallenge=true
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
      - --certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.cloudflare.acme.storage=/etc/traefik/acme.json
      # Redirect all HTTP traffic to HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APPDATA}/traefik:/etc/traefik
    environment:
      # NOTE: lego (Traefik's ACME library) expects CF_DNS_API_TOKEN for a
      # scoped Cloudflare API Token. CF_API_TOKEN is not read by the DNS-01
      # Cloudflare provider, which is why SSL wasn't provisioning.
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN_NAME}`)
      - traefik.http.routers.traefik.entrypoints=websecure
      - traefik.http.routers.traefik.tls.certresolver=cloudflare
      - traefik.http.routers.traefik.service=api@internal
      # Comment below to disable basic auth to the dashboard (generate hash with openssl passwd -apr1 yourpassword)
      - traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_USER}:${TRAEFIK_PASSWORD_HASH}
      - traefik.http.routers.traefik.middlewares=traefik-auth
      # AutoKuma monitor
      - kuma.traefik.http.name=Traefik
      - kuma.traefik.http.url=https://traefik.${DOMAIN_NAME}
      - kuma.traefik.http.accepted_statuscodes=["200","401"]   # basic auth returns 401
      - kuma.traefik.http.notification_name_list=["ntfy-uptime"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # ---------------- Docker management UI ----------------
  portainer:
    image: portainer/portainer-ce@sha256:3fa8750ac2b98ce56784ca292df1adc3ec38f0062fd572811ea4b2221beee310
    container_name: portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APPDATA}/portainer:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer.rule=Host(`portainer.${DOMAIN_NAME}`)
      - traefik.http.routers.portainer.entrypoints=websecure
      - traefik.http.routers.portainer.tls.certresolver=cloudflare
      - traefik.http.services.portainer.loadbalancer.server.port=9000
      # Restrict access to LAN + Tailscale only (100.64.0.0/10 = Tailscale's CGNAT range)
      - traefik.http.middlewares.portainer-whitelist.ipwhitelist.sourcerange=${LAN_SUBNET},100.64.0.0/10
      - traefik.http.routers.portainer.middlewares=portainer-whitelist
      # AutoKuma monitor
      - kuma.portainer.http.name=Portainer
      # - kuma.portainer.http.url=https://portainer.${DOMAIN_NAME}
      - kuma.portainer.http.url=http://portainer:9000
      - kuma.portainer.http.notification_name_list=["ntfy-uptime"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # ---------------- DNS / ad-blocking ----------------
  pihole:
    image: pihole/pihole@sha256:f7d1be836e3bc608b56d82fc9904f5a831cdfbc0dc9c6d58f94e4c985c70038b
    container_name: pihole
    hostname: pihole
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_listeningMode: all # options: all, local
      FTLCONF_dns_hosts: |
        ${SERVER_IP} home.${DOMAIN_NAME}
        ${SERVER_IP} traefik.${DOMAIN_NAME}
        ${SERVER_IP} portainer.${DOMAIN_NAME}
        ${SERVER_IP} pihole.${DOMAIN_NAME}
        ${SERVER_IP} plex.${DOMAIN_NAME}
        ${SERVER_IP} torrent.${DOMAIN_NAME}
        ${SERVER_IP} files.${DOMAIN_NAME}
        ${SERVER_IP} pdf.${DOMAIN_NAME}
        ${SERVER_IP} books.${DOMAIN_NAME}
        ${SERVER_IP} ntfy.${DOMAIN_NAME}
        ${SERVER_IP} minecraft.${DOMAIN_NAME}
        ${SERVER_IP} status.${DOMAIN_NAME}
    volumes:
      - ${APPDATA}/pihole/etc-pihole:/etc/pihole
      - ${APPDATA}/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    labels:
      - traefik.enable=true
      - traefik.http.routers.pihole.rule=Host(`pihole.${DOMAIN_NAME}`)
      - traefik.http.routers.pihole.entrypoints=websecure
      - traefik.http.routers.pihole.tls.certresolver=cloudflare
      - traefik.http.services.pihole.loadbalancer.server.port=80

      # AutoKuma DNS monitor
      # NOTE: uses a distinct id (pihole-dns) from the HTTP monitor below.
      # AutoKuma merges any labels that share the same <id> into a single
      # monitor definition - reusing "pihole" for both the dns and http
      # monitors previously caused them to collide into one broken monitor.
      - kuma.pihole-dns.dns.name=Pi-hole DNS
      - kuma.pihole-dns.dns.hostname=google.com
      - kuma.pihole-dns.dns.resolver=${SERVER_IP}
      - kuma.pihole-dns.dns.port=53
      - kuma.pihole-dns.dns.record_type=A
      - kuma.pihole-dns.dns.notification_name_list=["ntfy-uptime"]

      # AutoKuma HTTP monitor
      - kuma.pihole-http.http.name=Pi-hole Admin
      - kuma.pihole-http.http.url=https://pihole.${DOMAIN_NAME}/admin
      - kuma.pihole-http.http.accepted_statuscodes=["200"]
      - kuma.pihole-http.http.notification_name_list=["ntfy-uptime"]
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 200M

  # ---------------- Media server ----------------
  # Currently running:
  #   Plex 1.43.3.10896-cb3ebc72d-ls321
  plex:
    image: lscr.io/linuxserver/plex@sha256:f6c58cb2f5e41cd1397bf2ed4e61ef63bd86e0736841b3ef426fabfe04606293
    container_name: plex
    network_mode: host   # simplest for Plex discovery/DLNA; remove if you'd rather bridge+ports
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      VERSION: docker
    volumes:
      - ${APPDATA}/plex:/config
      - ${MEDIA}/movies:/movies
      - ${MEDIA}/tv:/tv
      - ${MEDIA}/downloads:/downloads
    restart: unless-stopped
    # devices:
    #   - /dev/dri:/dev/dri   # uncomment for Intel Quick Sync hardware transcoding
    # No Traefik labels here - Plex uses host networking so Docker label-based
    # discovery can't reach it. Routing + cert for plex.${DOMAIN_NAME} is defined
    # manually via Traefik's file provider, see:
    #   ${APPDATA}/traefik/dynamic/plex.yml
    # But AutoKuma can still monitor it:
    labels:
      - kuma.plex.http.name=Plex
      - kuma.plex.http.url=https://plex.${DOMAIN_NAME}
      - kuma.plex.http.accepted_statuscodes=["200","302","401"]   # Plex may redirect
      - kuma.plex.http.notification_name_list=["ntfy-uptime"]
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 2G

  # ---------------- Torrent client ----------------
  # Currently running:
  #   qBittorrent 5.2.3_v2.0.14-ls472
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent@sha256:212b86dff59e3962b4082b5ef20a577e76c8f8527d2ab505cfa887b4bcecb0b0
    container_name: qbittorrent
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: 8080
    volumes:
      - ${APPDATA}/qbittorrent:/config
      - ${MEDIA}/downloads:/downloads
      - ${MEDIA}/other:/other
    ports:
      - "6881:6881"
      - "6881:6881/udp"
    labels:
      - traefik.enable=true
      - traefik.http.routers.qbittorrent.rule=Host(`torrent.${DOMAIN_NAME}`)
      - traefik.http.routers.qbittorrent.entrypoints=websecure
      - traefik.http.routers.qbittorrent.tls.certresolver=cloudflare
      - traefik.http.services.qbittorrent.loadbalancer.server.port=8080
      # Restrict access to LAN + Tailscale only (100.64.0.0/10 = Tailscale's CGNAT range)
      - traefik.http.middlewares.qbittorrent-whitelist.ipwhitelist.sourcerange=${LAN_SUBNET},100.64.0.0/10
      - traefik.http.routers.qbittorrent.middlewares=qbittorrent-whitelist

      # Add trailing slash ONLY if missing (root path)
      # - traefik.http.middlewares.add-slash.redirectregex.regex=^(https?://torrent\.[^/]+)$
      # - traefik.http.middlewares.add-slash.redirectregex.replacement=$${1}/
      # - traefik.http.middlewares.add-slash.redirectregex.permanent=false
      # - traefik.http.routers.qbittorrent.middlewares=add-slash

      # AutoKuma monitor
      - kuma.torrent.http.name=qBittorrent
      # - kuma.torrent.http.url=https://torrent.${DOMAIN_NAME}
      - kuma.torrent.http.url=http://qbittorrent:8080
      - kuma.torrent.http.notification_name_list=["ntfy-uptime"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G

  # ---------------- PDF toolkit (merge, split, OCR, convert, compress, etc.) ----------------
  stirlingpdf:
    image: stirlingtools/stirling-pdf@sha256:3b3670fce70b396ec56ba380a3cc7858e0abf83fe13f31c88f7737847763a396
    container_name: stirlingpdf
    environment:
      TZ: ${TZ}
      DOCKER_ENABLE_SECURITY: "false"   # set true and configure login if exposing beyond LAN
    volumes:
      - ${APPDATA}/stirlingpdf/trainingData:/usr/share/tessdata   # OCR language data
      - ${APPDATA}/stirlingpdf/config:/configs
      - ${APPDATA}/stirlingpdf/logs:/logs
    labels:
      - traefik.enable=true
      - traefik.http.routers.stirlingpdf.rule=Host(`pdf.${DOMAIN_NAME}`)
      - traefik.http.routers.stirlingpdf.entrypoints=websecure
      - traefik.http.routers.stirlingpdf.tls.certresolver=cloudflare
      - traefik.http.services.stirlingpdf.loadbalancer.server.port=8080
      # Restrict access to LAN + Tailscale only (100.64.0.0/10 = Tailscale's CGNAT range)
      - traefik.http.middlewares.stirlingpdf-whitelist.ipwhitelist.sourcerange=${LAN_SUBNET},100.64.0.0/10
      - traefik.http.routers.stirlingpdf.middlewares=stirlingpdf-whitelist
      # AutoKuma monitor
      - kuma.pdf.http.name=Stirling PDF
      # - kuma.pdf.http.url=https://pdf.${DOMAIN_NAME}
      - kuma.pdf.http.url=http://stirlingpdf:8080
      - kuma.pdf.http.notification_name_list=["ntfy-uptime"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 2G

  # ---------------- Ebook library & web reader ----------------
  # Calibre-Web NextGen
  # Pinned to exact image digest.
  calibreweb:
    image: ghcr.io/new-usemame/calibre-web-nextgen@sha256:9ac36a23138e2c84fa48bd9f9e13c8ce1128f53764408ac57e15226628545f87
    container_name: calibreweb
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${APPDATA}/calibreweb:/config
      - ${MEDIA}/books:/calibre-library
      - ${MEDIA}/calibreweb-ingest:/cwa-book-ingest
    labels:
      - traefik.enable=true
      - traefik.http.routers.calibreweb.rule=Host(`books.${DOMAIN_NAME}`)
      - traefik.http.routers.calibreweb.entrypoints=websecure
      - traefik.http.routers.calibreweb.tls.certresolver=cloudflare
      - traefik.http.services.calibreweb.loadbalancer.server.port=8083
      # AutoKuma monitor
      - kuma.books.http.name=Calibre-Web
      - kuma.books.http.url=https://books.${DOMAIN_NAME}
      - kuma.books.http.notification_name_list=["ntfy-uptime"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M

  # ---------------- Push notifications (send alerts from scripts/containers to your phone) ----------------
  ntfy:
    image: binwiederhier/ntfy@sha256:f2419f405127afa868f10985c1a41449e673477cee1eb19994339a5ae8b592e7
    container_name: ntfy
    command:
      - serve
    environment:
      TZ: ${TZ}
      NTFY_BASE_URL: https://ntfy.${DOMAIN_NAME}/   # used in notification links; update if you proxy over HTTPS instead
      NTFY_BEHIND_PROXY: true
      NTFY_ENABLE_LOGIN: "false"
      # NTFY_ACCESS_CONTROL_ALLOW_ORIGIN: "*"
      NTFY_VISITOR_REQUEST_LIMIT_BURST: "300"
      NTFY_VISITOR_REQUEST_LIMIT_REPLENISH: "1s"
      NTFY_VISITOR_SUBSCRIPTION_LIMIT: "200"
    volumes:
      - ${APPDATA}/ntfy/cache:/var/cache/ntfy
      - ${APPDATA}/ntfy/etc:/etc/ntfy
    labels:
      - traefik.enable=true
      - traefik.http.routers.ntfy.rule=Host(`ntfy.${DOMAIN_NAME}`)
      - traefik.http.routers.ntfy.entrypoints=websecure
      - traefik.http.routers.ntfy.tls.certresolver=cloudflare
      - traefik.http.services.ntfy.loadbalancer.server.port=80

      # CORS: reflect the Origin header back only when it's the bare domain
      # or any subdomain of it (e.g. home.${DOMAIN_NAME}, dashboard.${DOMAIN_NAME}).
      # Covers current and future embeds without ever needing to edit this
      # again when you add another subdomain.
      # NOTE: no NTFY_ACCESS_CONTROL_ALLOW_ORIGIN here on purpose - CORS is
      # handled entirely by the Traefik middleware below instead, so ntfy
      # doesn't emit its own Access-Control-Allow-Origin header. Having both
      # ntfy and Traefik set that header results in duplicate values, which
      # browsers reject as invalid CORS.
      - traefik.http.middlewares.ntfy-cors.headers.accessControlAllowOriginListRegex=^https://([a-zA-Z0-9-]+\.)?${DOMAIN_NAME}$$
      - traefik.http.middlewares.ntfy-cors.headers.accessControlAllowMethods=GET,POST,PUT,DELETE,OPTIONS
      - traefik.http.middlewares.ntfy-cors.headers.accessControlAllowHeaders=*
      - traefik.http.middlewares.ntfy-cors.headers.accessControlMaxAge=86400
      - traefik.http.middlewares.ntfy-cors.headers.addVaryHeader=true
      - traefik.http.routers.ntfy.middlewares=ntfy-cors

      # AutoKuma monitor
      # NOTE: this only monitors ntfy's own uptime. It intentionally does NOT
      # get notification_name_list, since if ntfy itself is down it can't be
      # the one to tell you that.
      - kuma.ntfy.http.name=ntfy
      - kuma.ntfy.http.url=https://ntfy.${DOMAIN_NAME}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # ---------------- Indexer manager (disabled - uncomment to enable automation) ----------------
  # If you enable this, also add "${SERVER_IP} prowlarr.${DOMAIN_NAME}" to FTLCONF_dns_hosts above.
  # prowlarr:
  #   image: lscr.io/linuxserver/prowlarr:latest
  #   container_name: prowlarr
  #   environment:
  #     PUID: ${PUID}
  #     PGID: ${PGID}
  #     TZ: ${TZ}
  #   volumes:
  #     - ${APPDATA}/prowlarr:/config
  #   labels:
  #     - traefik.enable=true
  #     - traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN_NAME}`)
  #     - traefik.http.routers.prowlarr.entrypoints=websecure
  #     - traefik.http.routers.prowlarr.tls.certresolver=cloudflare
  #     - traefik.http.services.prowlarr.loadbalancer.server.port=9696
  #     # AutoKuma monitor (commented out, but you could add it later)
  #   restart: unless-stopped
  #   # deploy:
  #   #   resources:
  #   #     limits:
  #   #       cpus: '0.50'
  #   #       memory: 384M

  # ---------------- TV automation (disabled - uncomment to enable automation) ----------------
  # If you enable this, also add "${SERVER_IP} sonarr.${DOMAIN_NAME}" to FTLCONF_dns_hosts above.
  # sonarr:
  #   image: lscr.io/linuxserver/sonarr:latest
  #   container_name: sonarr
  #   environment:
  #     PUID: ${PUID}
  #     PGID: ${PGID}
  #     TZ: ${TZ}
  #   volumes:
  #     - ${APPDATA}/sonarr:/config
  #     - ${MEDIA}/tv:/tv
  #     - ${MEDIA}/downloads:/downloads
  #   labels:
  #     - traefik.enable=true
  #     - traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN_NAME}`)
  #     - traefik.http.routers.sonarr.entrypoints=websecure
  #     - traefik.http.routers.sonarr.tls.certresolver=cloudflare
  #     - traefik.http.services.sonarr.loadbalancer.server.port=8989
  #   restart: unless-stopped
  #   # deploy:
  #   #   resources:
  #   #     limits:
  #   #       cpus: '0.50'
  #   #       memory: 384M

  # ---------------- Movie automation (disabled - uncomment to enable automation) ----------------
  # If you enable this, also add "${SERVER_IP} radarr.${DOMAIN_NAME}" to FTLCONF_dns_hosts above.
  # radarr:
  #   image: lscr.io/linuxserver/radarr:latest
  #   container_name: radarr
  #   environment:
  #     PUID: ${PUID}
  #     PGID: ${PGID}
  #     TZ: ${TZ}
  #   volumes:
  #     - ${APPDATA}/radarr:/config
  #     - ${MEDIA}/movies:/movies
  #     - ${MEDIA}/downloads:/downloads
  #   labels:
  #     - traefik.enable=true
  #     - traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN_NAME}`)
  #     - traefik.http.routers.radarr.entrypoints=websecure
  #     - traefik.http.routers.radarr.tls.certresolver=cloudflare
  #     - traefik.http.services.radarr.loadbalancer.server.port=7878
  #   restart: unless-stopped
  #   # deploy:
  #   #   resources:
  #   #     limits:
  #   #       cpus: '0.50'
  #   #       memory: 384M

  # ---------------- Network file share (browse & clean up media over LAN) ----------------
  samba:
    image: dperson/samba@sha256:66088b78a19810dd1457a8f39340e95e663c728083efa5fe7dc0d40b2478e869
    container_name: samba
    environment:
      TZ: ${TZ}
    volumes:
      - ${MEDIA}:/media
    ports:
      - "139:139"
      - "445:445"
    command: >
      -u "${SMB_USER};${SMB_PASSWORD}"
      -s "media;/media;yes;no;no;${SMB_USER}"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # ---------------- Tailscale (remote access via WireGuard mesh VPN) ----------------
  tailscale:
    image: tailscale/tailscale@sha256:8c42c4574ab066384fcb72f69e086a2ff1dd3652eb6f56856cee34bcf0d2f680
    container_name: tailscale
    hostname: home-server
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}          # generate at https://login.tailscale.com/admin/settings/keys
      TS_STATE_DIR: /var/lib/tailscale
      TS_EXTRA_ARGS: --advertise-routes=${LAN_SUBNET} --accept-dns=false
      # add --advertise-exit-node too if you also want to route ALL internet traffic through home
    volumes:
      - ${APPDATA}/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # ---------------- Uptime Kuma (Status of all the services) ----------------
  uptime-kuma:
  # Version 2 latest digest
    image: louislam/uptime-kuma@sha256:3e24e96c89efff0e3a4b0698cbdd36c15ad3022371db57166e5588853002ee5c
    container_name: uptime-kuma
    volumes:
      - ${APPDATA}/uptime-kuma:/app/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.kuma.rule=Host(`status.${DOMAIN_NAME}`)
      - traefik.http.routers.kuma.entrypoints=websecure
      - traefik.http.routers.kuma.tls.certresolver=cloudflare
      - traefik.http.services.kuma.loadbalancer.server.port=3001
      # AutoKuma monitor for itself (optional, but can be useful)
      - kuma.kuma.http.name=Uptime Kuma
      - kuma.kuma.http.url=https://status.${DOMAIN_NAME}

      # AutoKuma-managed ntfy notification provider.
      - kuma.ntfy-uptime.notification.name=ntfy
      - kuma.ntfy-uptime.notification.active=true
      - kuma.ntfy-uptime.notification.config={"type":"ntfy","ntfyserverurl":"https://ntfy.${DOMAIN_NAME}","ntfytopic":"${NTFY_UPTIME_KUMA_TOPIC}","ntfyPriority":5,"ntfyAuthenticationMethod":"none"}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 384M

  # ---------------- AutoKuma (automatic monitor creation from Docker labels) ----------------
  autokuma:
    image: ghcr.io/bigboot/autokuma@sha256:8acbd3ad3ec8cb6c066aa0ee541154921283ec78159015937128541921c47974
    container_name: autokuma
    restart: unless-stopped
    environment:
      AUTOKUMA__KUMA__URL: http://uptime-kuma:3001
      AUTOKUMA__KUMA__USERNAME: ${KUMA_USERNAME}
      AUTOKUMA__KUMA__PASSWORD: ${KUMA_PASSWORD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APPDATA}/autokuma:/data
    # No labels needed – AutoKuma ignores itself by default
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

networks:
  default:
    name: home-server-net

# Tune kernel swap behavior for containers.
# 10 = minimal swap (safety net without thrashing your SSD)
# mem_swappiness: 10