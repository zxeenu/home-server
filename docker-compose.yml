# ---------------------------------------------------------------------------
# HOME SERVER STACK
# Services: Homepage (static dashboard of links), Traefik (reverse proxy with
#           automatic HTTPS via Cloudflare DNS-01), Portainer (docker mgmt UI),
#           Pi-hole (DNS + ad-block), Plex, qBittorrent, Stirling PDF (PDF toolkit),
#           Calibre-Web (ebook library/reader), ntfy (push notifications),
#           Samba (network file browsing)
#           Sonarr / Radarr / Prowlarr are included but commented out below -
#           uncomment them later if you want automated TV/movie fetching.
#
# IMAGE PINNING:
#   All currently-running images are pinned to their exact image digest.
#   This prevents `latest` from silently changing what gets deployed.
#
#   To intentionally update an image:
#       docker compose pull
#       docker compose up -d
#
#   Then inspect the new digest and update this file deliberately.
#
# BEFORE YOU START:
#   1. Create the folder structure on your host, e.g.:
#        /srv/appdata/{traefik,portainer,pihole,plex,qbittorrent,stirlingpdf,calibreweb,ntfy}
#        /srv/media/{movies,tv,downloads,books}
#   2. Keep index.html in the SAME folder as this docker-compose.yml
#      (the homepage service mounts it directly from there - no copying needed).
#   3. Local DNS records for Pi-hole (home.${DOMAIN_NAME}, plex.${DOMAIN_NAME}, etc.) are set
#      via the FTLCONF_dns_hosts environment variable below, using SERVER_IP
#      from .env - no separate file needed (Pi-hole v6 no longer reads
#      custom.list).
#   4. Edit the .env file with your paths, timezone, passwords, and:
#        ACME_EMAIL=your-email@example.com
#        CF_DNS_API_TOKEN=your_token
#   5. Run: docker compose up -d
#   6. Traefik will automatically obtain Let's Encrypt certificates via DNS-01
#      for all configured subdomains. All services are reachable at:
#      https://<subdomain>.${DOMAIN_NAME}
#   7. The Traefik dashboard is available at https://traefik.${DOMAIN_NAME}
#      (basic auth is commented out below – uncomment to enable).
#   8. In Pi-hole, set your router's DNS (or each device's DNS) to the
#      server's IP so *.${DOMAIN_NAME} resolves for every device on the network.
# ---------------------------------------------------------------------------

services:

  # ---------------- Home dashboard (static landing page linking to all services) ----------------
  homepage:
    image: nginx:alpine@sha256:db35bfc6b2951e7f8a72db5db120288c127ffaeeb4a6d4b95a26fead017d5913
    container_name: homepage
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./services.json:/usr/share/nginx/html/services.json:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.homepage.rule=Host(`home.${DOMAIN_NAME}`)
      - traefik.http.routers.homepage.entrypoints=websecure
      - traefik.http.routers.homepage.tls.certresolver=cloudflare
      - traefik.http.services.homepage.loadbalancer.server.port=80
    restart: unless-stopped

  # ---------------- Traefik reverse proxy (handles all HTTPS) ----------------
  traefik:
    image: traefik@sha256:ef751c695afd26e2be41009047f651153dc1e61ace03e6d13f299d8c4be842b8
    container_name: traefik
    command:
      - --log.level=DEBUG
      - --api.insecure=false
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # File provider: used only for services Traefik can't discover via Docker
      # labels, e.g. Plex, which runs with network_mode: host and therefore has
      # no reachable Docker-network IP for label-based discovery to use.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.cloudflare.acme.dnschallenge=true
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
      - --certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.cloudflare.acme.storage=/etc/traefik/acme.json
      # Redirect all HTTP traffic to HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APPDATA}/traefik:/etc/traefik
    environment:
      # NOTE: lego (Traefik's ACME library) expects CF_DNS_API_TOKEN for a
      # scoped Cloudflare API Token. CF_API_TOKEN is not read by the DNS-01
      # Cloudflare provider, which is why SSL wasn't provisioning.
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN_NAME}`)
      - traefik.http.routers.traefik.entrypoints=websecure
      - traefik.http.routers.traefik.tls.certresolver=cloudflare
      - traefik.http.routers.traefik.service=api@internal
      # Comment below to diasble basic auth to the dashboard (generate hash with openssl passwd -apr1 yourpassword)
      - traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_USER}:${TRAEFIK_PASSWORD_HASH}
      - traefik.http.routers.traefik.middlewares=traefik-auth
    restart: unless-stopped

  # ---------------- Docker management UI ----------------
  portainer:
    image: portainer/portainer-ce@sha256:3fa8750ac2b98ce56784ca292df1adc3ec38f0062fd572811ea4b2221beee310
    container_name: portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APPDATA}/portainer:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer.rule=Host(`portainer.${DOMAIN_NAME}`)
      - traefik.http.routers.portainer.entrypoints=websecure
      - traefik.http.routers.portainer.tls.certresolver=cloudflare
      - traefik.http.services.portainer.loadbalancer.server.port=9000
    restart: unless-stopped

  # ---------------- DNS / ad-blocking ----------------
  pihole:
    image: pihole/pihole@sha256:f7d1be836e3bc608b56d82fc9904f5a831cdfbc0dc9c6d58f94e4c985c70038b
    container_name: pihole
    hostname: pihole
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_listeningMode: all
      FTLCONF_dns_hosts: |
        ${SERVER_IP} home.${DOMAIN_NAME}
        ${SERVER_IP} traefik.${DOMAIN_NAME}
        ${SERVER_IP} portainer.${DOMAIN_NAME}
        ${SERVER_IP} pihole.${DOMAIN_NAME}
        ${SERVER_IP} plex.${DOMAIN_NAME}
        ${SERVER_IP} torrent.${DOMAIN_NAME}
        ${SERVER_IP} files.${DOMAIN_NAME}
        ${SERVER_IP} pdf.${DOMAIN_NAME}
        ${SERVER_IP} books.${DOMAIN_NAME}
        ${SERVER_IP} ntfy.${DOMAIN_NAME}
        ${SERVER_IP} minecraft.${DOMAIN_NAME}
    volumes:
      - ${APPDATA}/pihole/etc-pihole:/etc/pihole
      - ${APPDATA}/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    labels:
      - traefik.enable=true
      - traefik.http.routers.pihole.rule=Host(`pihole.${DOMAIN_NAME}`)
      - traefik.http.routers.pihole.entrypoints=websecure
      - traefik.http.routers.pihole.tls.certresolver=cloudflare
      - traefik.http.services.pihole.loadbalancer.server.port=80
    restart: unless-stopped
    cap_add:
      - NET_ADMIN

  # ---------------- Media server ----------------
  plex:
    image: lscr.io/linuxserver/plex@sha256:f6c58cb2f5e41cd1397bf2ed4e61ef63bd86e0736841b3ef426fabfe04606293
    container_name: plex
    network_mode: host   # simplest for Plex discovery/DLNA
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      VERSION: docker
    volumes:
      - ${APPDATA}/plex:/config
      - ${MEDIA}/movies:/movies
      - ${MEDIA}/tv:/tv
      - ${MEDIA}/downloads:/downloads
    restart: unless-stopped
    # devices:
    #   - /dev/dri:/dev/dri   # uncomment for Intel Quick Sync hardware transcoding
    # No Traefik labels here - Plex uses host networking so Docker label-based
    # discovery can't reach it. Routing + cert for plex.${DOMAIN_NAME} is defined
    # manually via Traefik's file provider, see:
    #   ${APPDATA}/traefik/dynamic/plex.yml

  # ---------------- Torrent client ----------------
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent@sha256:212b86dff59e3962b4082b5ef20a577e76c8f8527d2ab505cfa887b4bcecb0b0
    container_name: qbittorrent
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: 8080
    volumes:
      - ${APPDATA}/qbittorrent:/config
      - ${MEDIA}/downloads:/downloads
      - ${MEDIA}/other:/other
    ports:
      - "6881:6881"
      - "6881:6881/udp"
    labels:
      - traefik.enable=true
      - traefik.http.routers.qbittorrent.rule=Host(`torrent.${DOMAIN_NAME}`)
      - traefik.http.routers.qbittorrent.entrypoints=websecure
      - traefik.http.routers.qbittorrent.tls.certresolver=cloudflare
      - traefik.http.services.qbittorrent.loadbalancer.server.port=8080
      - traefik.http.middlewares.add-slash.redirectregex.regex=^(https?://torrent\.[^/]+)/?$
      - traefik.http.middlewares.add-slash.redirectregex.replacement=$${1}/
      - traefik.http.middlewares.add-slash.redirectregex.permanent=false
      - traefik.http.routers.qbittorrent.middlewares=add-slash
    restart: unless-stopped

  # ---------------- PDF toolkit ----------------
  stirlingpdf:
    image: stirlingtools/stirling-pdf@sha256:3b3670fce70b396ec56ba380a3cc7858e0abf83fe13f31c88f7737847763a396
    container_name: stirlingpdf
    environment:
      TZ: ${TZ}
      DOCKER_ENABLE_SECURITY: "false"
    volumes:
      - ${APPDATA}/stirlingpdf/trainingData:/usr/share/tessdata
      - ${APPDATA}/stirlingpdf/config:/configs
      - ${APPDATA}/stirlingpdf/logs:/logs
    labels:
      - traefik.enable=true
      - traefik.http.routers.stirlingpdf.rule=Host(`pdf.${DOMAIN_NAME}`)
      - traefik.http.routers.stirlingpdf.entrypoints=websecure
      - traefik.http.routers.stirlingpdf.tls.certresolver=cloudflare
      - traefik.http.services.stirlingpdf.loadbalancer.server.port=8080
    restart: unless-stopped

  # ---------------- Ebook library ----------------
  calibreweb:
    image: ghcr.io/new-usemame/calibre-web-nextgen@sha256:9ac36a23138e2c84fa48bd9f9e13c8ce1128f53764408ac57e15226628545f87
    container_name: calibreweb
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${APPDATA}/calibreweb:/config
      - ${MEDIA}/books:/calibre-library
      - ${MEDIA}/calibreweb-ingest:/cwa-book-ingest
    labels:
      - traefik.enable=true
      - traefik.http.routers.calibreweb.rule=Host(`books.${DOMAIN_NAME}`)
      - traefik.http.routers.calibreweb.entrypoints=websecure
      - traefik.http.routers.calibreweb.tls.certresolver=cloudflare
      - traefik.http.services.calibreweb.loadbalancer.server.port=8083
    restart: unless-stopped

  # ---------------- Push notifications ----------------
  ntfy:
    image: binwiederhier/ntfy@sha256:f2419f405127afa868f10985c1a41449e673477cee1eb19994339a5ae8b592e7
    container_name: ntfy
    command:
      - serve
    environment:
      TZ: ${TZ}
      NTFY_BASE_URL: https://ntfy.${DOMAIN_NAME}/
      NTFY_BEHIND_PROXY: true
      NTFY_ENABLE_LOGIN: "false"
      NTFY_ACCESS_CONTROL_ALLOW_ORIGIN: "*"
    volumes:
      - ${APPDATA}/ntfy/cache:/var/cache/ntfy
      - ${APPDATA}/ntfy/etc:/etc/ntfy
    labels:
      - traefik.enable=true
      - traefik.http.routers.ntfy.rule=Host(`ntfy.${DOMAIN_NAME}`)
      - traefik.http.routers.ntfy.entrypoints=websecure
      - traefik.http.routers.ntfy.tls.certresolver=cloudflare
      - traefik.http.services.ntfy.loadbalancer.server.port=80
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------- Indexer manager (disabled - uncomment to enable automation) ----------------
  # prowlarr:
  #   image: lscr.io/linuxserver/prowlarr:latest
  #   container_name: prowlarr
  #   environment:
  #     PUID: ${PUID}
  #     PGID: ${PGID}
  #     TZ: ${TZ}
  #   volumes:
  #     - ${APPDATA}/prowlarr:/config
  #   labels:
  #     - traefik.enable=true
  #     - traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN_NAME}`)
  #     - traefik.http.routers.prowlarr.entrypoints=websecure
  #     - traefik.http.routers.prowlarr.tls.certresolver=cloudflare
  #     - traefik.http.services.prowlarr.loadbalancer.server.port=9696
  #   restart: unless-stopped

  # ---------------- TV automation (disabled - uncomment to enable automation) ----------------
  # sonarr:
  #   image: lscr.io/linuxserver/sonarr:latest
  #   container_name: sonarr
  #   environment:
  #     PUID: ${PUID}
  #     PGID: ${PGID}
  #     TZ: ${TZ}
  #   volumes:
  #     - ${APPDATA}/sonarr:/config
  #     - ${MEDIA}/tv:/tv
  #     - ${MEDIA}/downloads:/downloads
  #   labels:
  #     - traefik.enable=true
  #     - traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN_NAME}`)
  #     - traefik.http.routers.sonarr.entrypoints=websecure
  #     - traefik.http.routers.sonarr.tls.certresolver=cloudflare
  #     - traefik.http.services.sonarr.loadbalancer.server.port=8989
  #   restart: unless-stopped

  # ---------------- Movie automation (disabled - uncomment to enable automation) ----------------
  # radarr:
  #   image: lscr.io/linuxserver/radarr:latest
  #   container_name: radarr
  #   environment:
  #     PUID: ${PUID}
  #     PGID: ${PGID}
  #     TZ: ${TZ}
  #   volumes:
  #     - ${APPDATA}/radarr:/config
  #     - ${MEDIA}/movies:/movies
  #     - ${MEDIA}/downloads:/downloads
  #   labels:
  #     - traefik.enable=true
  #     - traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN_NAME}`)
  #     - traefik.http.routers.radarr.entrypoints=websecure
  #     - traefik.http.routers.radarr.tls.certresolver=cloudflare
  #     - traefik.http.services.radarr.loadbalancer.server.port=7878
  #   restart: unless-stopped

  # ---------------- Network file share (browse & clean up media over LAN) ----------------
  samba:
    image: dperson/samba@sha256:66088b78a19810dd1457a8f39340e95e663c728083efa5fe7dc0d40b2478e869
    container_name: samba
    environment:
      TZ: ${TZ}
    volumes:
      - ${MEDIA}:/media
    ports:
      - "139:139"
      - "445:445"
    command: >
      -u "${SMB_USER};${SMB_PASSWORD}"
      -s "media;/media;yes;no;no;${SMB_USER}"
    restart: unless-stopped

  # ---------------- Tailscale (remote access via WireGuard mesh VPN) ----------------
  tailscale:
    image: tailscale/tailscale@sha256:8c42c4574ab066384fcb72f69e086a2ff1dd3652eb6f56856cee34bcf0d2f680
    container_name: tailscale
    hostname: home-server
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}          # generate at https://login.tailscale.com/admin/settings/keys
      TS_STATE_DIR: /var/lib/tailscale
      TS_EXTRA_ARGS: --advertise-routes=${LAN_SUBNET} --accept-dns=false
      # add --advertise-exit-node too if you also want to route ALL internet traffic through home
    volumes:
      - ${APPDATA}/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

networks:
  default:
    name: home-server-net