# ---------------------------------------------------------------------------
# HOME SERVER STACK
# Services: Homepage (static dashboard of links), Traefik (reverse proxy with
#           automatic HTTPS via Cloudflare DNS-01), Portainer (docker mgmt UI),
#           Pi-hole (DNS + ad-block), Plex, qBittorrent, Stirling PDF (PDF toolkit),
#           Calibre-Web (ebook library/reader), ntfy (push notifications),
#           Samba (network file browsing)
#           Sonarr / Radarr / Prowlarr are included but commented out below -
#           uncomment them later if you want automated TV/movie fetching.
#
# IMAGE PINNING:
#   All currently-running images are pinned to their exact image digest.
#   This prevents `latest` from silently changing what gets deployed.
#
#   To intentionally update an image:
#       docker compose pull
#       docker compose up -d
#
#   Then inspect the new digest and update this file deliberately.
#
# BEFORE YOU START:
#   1. Create the folder structure on your host, e.g.:
#        /srv/appdata/{traefik,portainer,pihole,plex,qbittorrent,stirlingpdf,calibreweb,ntfy}
#        /srv/media/{movies,tv,downloads,books}
#   2. Keep index.html in the SAME folder as this docker-compose.yml
#      (the homepage service mounts it directly from there - no copying needed).
#   3. Local DNS records for Pi-hole (home.${DOMAIN_NAME}, plex.${DOMAIN_NAME}, etc.) are set
#      via the FTLCONF_dns_hosts environment variable below, using SERVER_IP
#      from .env - no separate file needed (Pi-hole v6 no longer reads
#      custom.list).
#   4. Edit the .env file with your paths, timezone, passwords, and:
#        ACME_EMAIL=your-email@example.com
#        CF_DNS_API_TOKEN=your_token
#        KUMA_USERNAME=admin
#        KUMA_PASSWORD=your-strong-password
#        NTFY_UPTIME_KUMA_TOPIC=your-long-unguessable-topic-name
#   5. Run: docker compose up -d
#   6. Traefik will automatically obtain Let's Encrypt certificates via DNS-01
#      for all configured subdomains. All services are reachable at:
#      https://<subdomain>.${DOMAIN_NAME}
#   7. The Traefik dashboard is available at:
#      https://traefik.${DOMAIN_NAME}
#   8. In Pi-hole, set your router's DNS (or each device's DNS) to the
#      server's IP so *.${DOMAIN_NAME} resolves for every device on the network.
#   9. AutoKuma automatically creates Uptime Kuma monitors from Docker labels.
#      It reads the kuma.* labels defined on each container. No manual setup
#      in the Uptime Kuma UI is needed.
#  10. Push notifications: the `uptime-kuma` service below declares a single
#      AutoKuma-managed "ntfy" notification provider. Every other service's
#      monitor labels reference it via notification_name_list=["ntfy-uptime"].
# ---------------------------------------------------------------------------

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

name: home-server

services:

  # ---------------- Secure Docker socket proxy (READ-ONLY) for Traefik & AutoKuma ----------------
  docker-proxy-ro:
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: docker-proxy-ro
    logging: *default-logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - LOG_LEVEL=info

      # --- Only what Traefik & AutoKuma need ---
      - CONTAINERS=1
      - NETWORKS=1
      - EVENTS=1
      - INFO=1
      - VERSION=1

      # --- Explicitly deny everything else ---
      - AUTH=0
      - SECRETS=0
      - HOST=0
      - POST=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - EXEC=0
      - GRPC=0
      - IMAGES=0
      - NODES=0
      - PING=0
      - PLUGINS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - VOLUMES=0

    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M

  # ---------------- Secure Docker socket proxy (FULL ACCESS) for Portainer ----------------
  docker-proxy-rw:
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: docker-proxy-rw
    logging: *default-logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - LOG_LEVEL=info

      # --- Docker API access Portainer needs ---
      - PING=1
      - VERSION=1
      - INFO=1
      - CONTAINERS=1
      - EVENTS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - SERVICES=1
      - SWARM=1
      - DISTRIBUTION=1

      # --- Container execution / management ---
      - EXEC=1

      # --- Write operations ---
      - POST=1
      - BUILD=1
      - COMMIT=1
      - CONTAINERS_CREATE=1
      - CONTAINERS_DELETE=1
      - CONTAINERS_START=1
      - CONTAINERS_STOP=1
      - CONTAINERS_RESTART=1
      - IMAGES_CREATE=1
      - IMAGES_DELETE=1
      - NETWORKS_CREATE=1
      - NETWORKS_DELETE=1
      - VOLUMES_CREATE=1
      - VOLUMES_DELETE=1

      # --- Explicitly disabled ---
      - AUTH=0
      - SECRETS=0
      - HOST=0
      - CONFIGS=0
      - GRPC=0
      - NODES=0
      - PLUGINS=0
      - SESSION=0
      - SYSTEM=0
      - TASKS=0

    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M

  # ---------------- Home dashboard (static landing page linking to all services) ----------------
  homepage:
    image: nginx:alpine@sha256:db35bfc6b2951e7f8a72db5db120288c127ffaeeb4a6d4b95a26fead017d5913
    logging: *default-logging
    container_name: homepage
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./services.json:/usr/share/nginx/html/services.json:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.homepage.rule=Host(`home.${DOMAIN_NAME}`)
      - traefik.http.routers.homepage.entrypoints=websecure
      - traefik.http.routers.homepage.tls.certresolver=cloudflare
      - traefik.http.services.homepage.loadbalancer.server.port=80
      - traefik.http.routers.homepage.middlewares=lan-only@docker
      - kuma.homepage.http.name=Homepage
      - kuma.homepage.http.url=http://homepage:80
      - kuma.homepage.http.notification_name_list=["ntfy-uptime"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

  # ---------------- Traefik reverse proxy (handles all HTTPS) ----------------
  traefik:
    image: traefik@sha256:ef751c695afd26e2be41009047f651153dc1e61ace03e6d13f299d8c4be842b8
    logging: *default-logging
    container_name: traefik
    command:
      - --log.level=INFO
      - --api.insecure=false
      - --api.dashboard=true

      # Docker provider through read-only socket proxy
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false

      # File provider for services Docker cannot discover through labels
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true

      # HTTP / HTTPS
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      # Cloudflare DNS-01
      - --certificatesresolvers.cloudflare.acme.dnschallenge=true
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
      - --certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.cloudflare.acme.storage=/etc/traefik/acme.json

      # Redirect HTTP to HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https

      # Uptime Kuma ping endpoint
      - --ping=true
      - --ping.entrypoint=web

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ${APPDATA}/traefik:/etc/traefik

    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
      - DOCKER_HOST=tcp://docker-proxy-ro:2375

    labels:
      - traefik.enable=true

      # Shared LAN + Tailscale access whitelist
      - traefik.http.middlewares.lan-only.ipallowlist.sourcerange=${LAN_SUBNET},100.64.0.0/10

      # Traefik dashboard
      - traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN_NAME}`)
      - traefik.http.routers.traefik.entrypoints=websecure
      - traefik.http.routers.traefik.tls.certresolver=cloudflare
      - traefik.http.routers.traefik.service=api@internal

      # Basic authentication
      - traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_USER}:${TRAEFIK_PASSWORD_HASH}
      - traefik.http.routers.traefik.middlewares=lan-only@docker,traefik-auth

      # AutoKuma monitor
      - kuma.traefik.http.name=Traefik
      - kuma.traefik.http.url=http://traefik:80/ping
      - kuma.traefik.http.accepted_statuscodes=["200"]
      - kuma.traefik.http.notification_name_list=["ntfy-uptime"]

    depends_on:
      - docker-proxy-ro

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # ---------------- Docker management UI ----------------
  portainer:
    image: portainer/portainer-ce@sha256:3fa8750ac2b98ce56784ca292df1adc3ec38f0062fd572811ea4b2221beee310
    logging: *default-logging
    container_name: portainer

    # Connect Portainer directly to the Docker socket proxy.
    command:
      - -H
      - tcp://docker-proxy-rw:2375

    volumes:
      - ${APPDATA}/portainer:/data

    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer.rule=Host(`portainer.${DOMAIN_NAME}`)
      - traefik.http.routers.portainer.entrypoints=websecure
      - traefik.http.routers.portainer.tls.certresolver=cloudflare
      - traefik.http.services.portainer.loadbalancer.server.port=9000
      - traefik.http.routers.portainer.middlewares=lan-only@docker

      # AutoKuma monitor
      - kuma.portainer.http.name=Portainer
      - kuma.portainer.http.url=http://portainer:9000
      - kuma.portainer.http.notification_name_list=["ntfy-uptime"]

    depends_on:
      - docker-proxy-rw

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # ---------------- DNS / ad-blocking ----------------
  pihole:
    image: pihole/pihole@sha256:f7d1be836e3bc608b56d82fc9904f5a831cdfbc0dc9c6d58f94e4c985c70038b
    logging: *default-logging
    container_name: pihole
    hostname: pihole

    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_listeningMode: all

      FTLCONF_dns_hosts: |
        ${SERVER_IP} home.${DOMAIN_NAME}
        ${SERVER_IP} traefik.${DOMAIN_NAME}
        ${SERVER_IP} portainer.${DOMAIN_NAME}
        ${SERVER_IP} pihole.${DOMAIN_NAME}
        ${SERVER_IP} plex.${DOMAIN_NAME}
        ${SERVER_IP} torrent.${DOMAIN_NAME}
        ${SERVER_IP} files.${DOMAIN_NAME}
        ${SERVER_IP} pdf.${DOMAIN_NAME}
        ${SERVER_IP} books.${DOMAIN_NAME}
        ${SERVER_IP} ntfy.${DOMAIN_NAME}
        ${SERVER_IP} minecraft.${DOMAIN_NAME}
        ${SERVER_IP} status.${DOMAIN_NAME}

    volumes:
      - ${APPDATA}/pihole/etc-pihole:/etc/pihole
      - ${APPDATA}/pihole/etc-dnsmasq.d:/etc/dnsmasq.d

    ports:
      - "53:53/tcp"
      - "53:53/udp"

    labels:
      - traefik.enable=true
      - traefik.http.routers.pihole.rule=Host(`pihole.${DOMAIN_NAME}`)
      - traefik.http.routers.pihole.entrypoints=websecure
      - traefik.http.routers.pihole.tls.certresolver=cloudflare
      - traefik.http.services.pihole.loadbalancer.server.port=80
      - traefik.http.routers.pihole.middlewares=lan-only@docker

      # AutoKuma DNS monitor
      - kuma.pihole-dns.dns.name=Pi-hole DNS
      - kuma.pihole-dns.dns.hostname=google.com
      - kuma.pihole-dns.dns.resolver=${SERVER_IP}
      - kuma.pihole-dns.dns.port=53
      - kuma.pihole-dns.dns.record_type=A
      - kuma.pihole-dns.dns.notification_name_list=["ntfy-uptime"]

      # AutoKuma HTTP monitor
      - kuma.pihole-http.http.name=Pi-hole Admin
      - kuma.pihole-http.http.url=http://pihole:80/admin
      - kuma.pihole-http.http.accepted_statuscodes=["200"]
      - kuma.pihole-http.http.notification_name_list=["ntfy-uptime"]

    restart: unless-stopped

    cap_add:
      - NET_ADMIN

    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 200M

  # ---------------- Media server ----------------
  plex:
    image: lscr.io/linuxserver/plex@sha256:f6c58cb2f5e41cd1397bf2ed4e61ef63bd86e0736841b3ef426fabfe04606293
    logging: *default-logging
    container_name: plex
    network_mode: host

    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      VERSION: docker

    volumes:
      - ${APPDATA}/plex:/config
      - ${MEDIA}/movies:/movies
      - ${MEDIA}/tv:/tv
      - ${MEDIA}/downloads:/downloads

    restart: unless-stopped

    # devices:
    #   - /dev/dri:/dev/dri

    labels:
      - kuma.plex.http.name=Plex
      - kuma.plex.http.url=http://${SERVER_IP}:32400
      - kuma.plex.http.accepted_statuscodes=["200","302","401"]
      - kuma.plex.http.notification_name_list=["ntfy-uptime"]

    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 2G

  # ---------------- Torrent client ----------------
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent@sha256:212b86dff59e3962b4082b5ef20a577e76c8f8527d2ab505cfa887b4bcecb0b0
    logging: *default-logging
    container_name: qbittorrent

    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: 8080

    volumes:
      - ${APPDATA}/qbittorrent:/config
      - ${MEDIA}/downloads:/downloads
      - ${MEDIA}/other:/other

    ports:
      - "6881:6881"
      - "6881:6881/udp"

    labels:
      - traefik.enable=true
      - traefik.http.routers.qbittorrent.rule=Host(`torrent.${DOMAIN_NAME}`)
      - traefik.http.routers.qbittorrent.entrypoints=websecure
      - traefik.http.routers.qbittorrent.tls.certresolver=cloudflare
      - traefik.http.services.qbittorrent.loadbalancer.server.port=8080
      - traefik.http.routers.qbittorrent.middlewares=lan-only@docker

      - kuma.torrent.http.name=qBittorrent
      - kuma.torrent.http.url=http://qbittorrent:8080
      - kuma.torrent.http.notification_name_list=["ntfy-uptime"]

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G

  # ---------------- PDF toolkit ----------------
  stirlingpdf:
    image: stirlingtools/stirling-pdf@sha256:3b3670fce70b396ec56ba380a3cc7858e0abf83fe13f31c88f7737847763a396
    logging: *default-logging
    container_name: stirlingpdf

    environment:
      TZ: ${TZ}
      DOCKER_ENABLE_SECURITY: "false"

    volumes:
      - ${APPDATA}/stirlingpdf/trainingData:/usr/share/tessdata
      - ${APPDATA}/stirlingpdf/config:/configs
      - ${APPDATA}/stirlingpdf/logs:/logs

    labels:
      - traefik.enable=true
      - traefik.http.routers.stirlingpdf.rule=Host(`pdf.${DOMAIN_NAME}`)
      - traefik.http.routers.stirlingpdf.entrypoints=websecure
      - traefik.http.routers.stirlingpdf.tls.certresolver=cloudflare
      - traefik.http.services.stirlingpdf.loadbalancer.server.port=8080
      - traefik.http.routers.stirlingpdf.middlewares=lan-only@docker

      - kuma.pdf.http.name=Stirling PDF
      - kuma.pdf.http.url=http://stirlingpdf:8080
      - kuma.pdf.http.notification_name_list=["ntfy-uptime"]

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 2G

  # ---------------- Ebook library & web reader ----------------
  calibreweb:
    image: ghcr.io/new-usemame/calibre-web-nextgen@sha256:9ac36a23138e2c84fa48bd9f9e13c8ce1128f53764408ac57e15226628545f87
    logging: *default-logging
    container_name: calibreweb

    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}

    volumes:
      - ${APPDATA}/calibreweb:/config
      - ${MEDIA}/books:/calibre-library
      - ${MEDIA}/calibreweb-ingest:/cwa-book-ingest

    labels:
      - traefik.enable=true
      - traefik.http.routers.calibreweb.rule=Host(`books.${DOMAIN_NAME}`)
      - traefik.http.routers.calibreweb.entrypoints=websecure
      - traefik.http.routers.calibreweb.tls.certresolver=cloudflare
      - traefik.http.services.calibreweb.loadbalancer.server.port=8083
      - traefik.http.routers.calibreweb.middlewares=lan-only@docker

      - kuma.books.http.name=Calibre-Web
      - kuma.books.http.url=http://calibreweb:8083
      - kuma.books.http.notification_name_list=["ntfy-uptime"]

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M

  # ---------------- Push notifications ----------------
  ntfy:
    image: binwiederhier/ntfy@sha256:f2419f405127afa868f10985c1a41449e673477cee1eb19994339a5ae8b592e7
    logging: *default-logging
    container_name: ntfy

    command:
      - serve

    environment:
      TZ: ${TZ}
      NTFY_BASE_URL: https://ntfy.${DOMAIN_NAME}
      NTFY_BEHIND_PROXY: true
      NTFY_ENABLE_LOGIN: "false"
      NTFY_VISITOR_REQUEST_LIMIT_BURST: "300"
      NTFY_VISITOR_REQUEST_LIMIT_REPLENISH: "1s"
      NTFY_VISITOR_SUBSCRIPTION_LIMIT: "200"

    volumes:
      - ${APPDATA}/ntfy/cache:/var/cache/ntfy
      - ${APPDATA}/ntfy/etc:/etc/ntfy

    labels:
      - traefik.enable=true
      - traefik.http.routers.ntfy.rule=Host(`ntfy.${DOMAIN_NAME}`)
      - traefik.http.routers.ntfy.entrypoints=websecure
      - traefik.http.routers.ntfy.tls.certresolver=cloudflare
      - traefik.http.services.ntfy.loadbalancer.server.port=80

      # Restrict access to LAN + Tailscale
      - traefik.http.routers.ntfy.middlewares=lan-only@docker,ntfy-cors

      # CORS
      - traefik.http.middlewares.ntfy-cors.headers.accessControlAllowOriginListRegex=^https://([a-zA-Z0-9-]+\.)?${DOMAIN_NAME}$$
      - traefik.http.middlewares.ntfy-cors.headers.accessControlAllowMethods=GET,POST,PUT,DELETE,OPTIONS
      - traefik.http.middlewares.ntfy-cors.headers.accessControlAllowHeaders=*
      - traefik.http.middlewares.ntfy-cors.headers.accessControlMaxAge=86400
      - traefik.http.middlewares.ntfy-cors.headers.addVaryHeader=true

      # AutoKuma monitor
      - kuma.ntfy.http.name=ntfy
      - kuma.ntfy.http.url=http://ntfy:80

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # ---------------- Indexer manager (disabled) ----------------
  # prowlarr:
  #   image: lscr.io/linuxserver/prowlarr:latest
  #   container_name: prowlarr
  #   environment:
  #     PUID: ${PUID}
  #     PGID: ${PGID}
  #     TZ: ${TZ}
  #   volumes:
  #     - ${APPDATA}/prowlarr:/config
  #   labels:
  #     - traefik.enable=true
  #     - traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN_NAME}`)
  #     - traefik.http.routers.prowlarr.entrypoints=websecure
  #     - traefik.http.routers.prowlarr.tls.certresolver=cloudflare
  #     - traefik.http.services.prowlarr.loadbalancer.server.port=9696
  #     - traefik.http.routers.prowlarr.middlewares=lan-only@docker
  #   restart: unless-stopped

  # ---------------- TV automation (disabled) ----------------
  # sonarr:
  #   image: lscr.io/linuxserver/sonarr:latest
  #   container_name: sonarr
  #   environment:
  #     PUID: ${PUID}
  #     PGID: ${PGID}
  #     TZ: ${TZ}
  #   volumes:
  #     - ${APPDATA}/sonarr:/config
  #     - ${MEDIA}/tv:/tv
  #     - ${MEDIA}/downloads:/downloads
  #   labels:
  #     - traefik.enable=true
  #     - traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN_NAME}`)
  #     - traefik.http.routers.sonarr.entrypoints=websecure
  #     - traefik.http.routers.sonarr.tls.certresolver=cloudflare
  #     - traefik.http.services.sonarr.loadbalancer.server.port=8989
  #     - traefik.http.routers.sonarr.middlewares=lan-only@docker
  #   restart: unless-stopped

  # ---------------- Movie automation (disabled) ----------------
  # radarr:
  #   image: lscr.io/linuxserver/radarr:latest
  #   container_name: radarr
  #   environment:
  #     PUID: ${PUID}
  #     PGID: ${PGID}
  #     TZ: ${TZ}
  #   volumes:
  #     - ${APPDATA}/radarr:/config
  #     - ${MEDIA}/movies:/movies
  #     - ${MEDIA}/downloads:/downloads
  #   labels:
  #     - traefik.enable=true
  #     - traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN_NAME}`)
  #     - traefik.http.routers.radarr.entrypoints=websecure
  #     - traefik.http.routers.radarr.tls.certresolver=cloudflare
  #     - traefik.http.services.radarr.loadbalancer.server.port=7878
  #     - traefik.http.routers.radarr.middlewares=lan-only@docker
  #   restart: unless-stopped

  # ---------------- Network file share ----------------
  samba:
    image: ghcr.io/servercontainers/samba@sha256:57859789bd3425e6e929269fa13b16251cc8b8f939e4362ed7100aaf41a17122
    logging: *default-logging
    container_name: samba

    volumes:
      - ${MEDIA}:/media

    ports:
      - "445:445"

    environment:
      TZ: ${TZ}
      UID_homeserver: ${PUID}
      ACCOUNT_homeserver: ${SMB_PASSWORD}
      SAMBA_VOLUME_CONFIG_media: |
        [Media]
        path = /media
        valid users = homeserver
        guest ok = no
        read only = no
        browseable = yes

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # ---------------- Tailscale (remote access via WireGuard mesh VPN) ----------------
  tailscale:
    image: tailscale/tailscale@sha256:8c42c4574ab066384fcb72f69e086a2ff1dd3652eb6f56856cee34bcf0d2f680
    logging: *default-logging
    container_name: tailscale
    hostname: home-server

    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      # TS_EXTRA_ARGS: --advertise-routes=${LAN_SUBNET} --accept-dns=false
      TS_EXTRA_ARGS: --advertise-routes=${LAN_SUBNET} --accept-dns=false --snat-subnet-routes=false

    volumes:
      - ${APPDATA}/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun

    cap_add:
      - NET_ADMIN
      - NET_RAW

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # ---------------- Uptime Kuma (Status of all the services) ----------------
  uptime-kuma:
    image: louislam/uptime-kuma@sha256:3e24e96c89efff0e3a4b0698cbdd36c15ad3022371db57166e5588853002ee5c
    logging: *default-logging
    container_name: uptime-kuma

    volumes:
      - ${APPDATA}/uptime-kuma:/app/data

    labels:
      - traefik.enable=true
      - traefik.http.routers.kuma.rule=Host(`status.${DOMAIN_NAME}`)
      - traefik.http.routers.kuma.entrypoints=websecure
      - traefik.http.routers.kuma.tls.certresolver=cloudflare
      - traefik.http.services.kuma.loadbalancer.server.port=3001
      - traefik.http.routers.kuma.middlewares=lan-only@docker

      # AutoKuma monitor for itself
      - kuma.kuma.http.name=Uptime Kuma
      - kuma.kuma.http.url=http://uptime-kuma:3001

      # AutoKuma-managed ntfy notification provider
      - kuma.ntfy-uptime.notification.name=ntfy
      - kuma.ntfy-uptime.notification.active=true
      - kuma.ntfy-uptime.notification.config={"type":"ntfy","ntfyserverurl":"https://ntfy.${DOMAIN_NAME}","ntfytopic":"${NTFY_UPTIME_KUMA_TOPIC}","ntfyPriority":5,"ntfyAuthenticationMethod":"none"}

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 384M

  # ---------------- AutoKuma (automatic monitor creation from Docker labels) ----------------
  autokuma:
    image: ghcr.io/bigboot/autokuma@sha256:8acbd3ad3ec8cb6c066aa0ee541154921283ec78159015937128541921c47974
    logging: *default-logging
    container_name: autokuma

    restart: unless-stopped

    depends_on:
      uptime-kuma:
        condition: service_started
      docker-proxy-ro:
        condition: service_started

    environment:
      AUTOKUMA__KUMA__URL: http://uptime-kuma:3001
      AUTOKUMA__KUMA__USERNAME: ${KUMA_USERNAME}
      AUTOKUMA__KUMA__PASSWORD: ${KUMA_PASSWORD}
      DOCKER_HOST: tcp://docker-proxy-ro:2375

    volumes:
      - ${APPDATA}/autokuma:/data

    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

networks:
  default:
    name: home-server-net

# Tune kernel swap behavior for containers.
# 10 = minimal swap (safety net without thrashing your SSD)
# mem_swappiness: 10
